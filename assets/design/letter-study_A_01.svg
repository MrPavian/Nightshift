<text x="1150" y="510" class="t">Formspannung</text><text x="1370" y="510" class="s">enge / offene Winkel</text><text x="1150" y="550" class="t">Verbindungen</text><text x="1370" y="550" class="s">Abstände / Überlappung</text><text x="1150" y="590" class="t">Rhythmus</text><text x="1370" y="590" class="s">Wiederholung / Kontrast</text><text x="1150" y="630" class="t">Lesbarkeit</text><text x="1370" y="630" class="s">Klarheit / kontrollierte Spannung</text><text x="1150" y="670" class="s">Keine Stil-Schublade ist ein festes Regelwerk.</text>
