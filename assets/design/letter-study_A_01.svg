<text x="1150" y="810" class="t">□ A-Skelett und Negativform konstruieren</text><text x="1150" y="855" class="t">□ Drei deutlich verschiedene Letter bauen</text><text x="1150" y="900" class="t">□ Handstyle und Blockform vergleichen</text><text x="1150" y="945" class="t">□ Outline, Fill und Schatten gezielt testen</text><text x="1150" y="980" class="s">Ziel: eine eigene, lesbare und charaktervolle A-Form.</text>
