<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="297mm" height="210mm" viewBox="0 0 1680 1188">
<title>NIGHTSHIFT Letter Construction Academy — A Graffiti Blackbook Study</title>
<desc>Neunfeldrige, editierbare Graffiti-Lernstudie zum Großbuchstaben A im Blackbook-Look.</desc>
<defs>
