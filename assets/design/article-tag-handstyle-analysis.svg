<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
<title id="t">Tag und Handstyle – schematische Analyse</title>
<desc id="d">Abstrakte, nicht lesbare Linienformen zeigen, wie Neigung, Rhythmus, Verbindungen und Endungen eine individuelle Schreibbewegung prägen. Keine reale Signatur und kein nachgezeichneter Tag.</desc>
<defs><style>
.bg{fill:#111214}.panel{fill:#191b1e;stroke:#41454a;stroke-width:2}
.txt{fill:#f0eee8;font:700 26px Arial,sans-serif}.body{fill:#c5c7c2;font:18px Arial,sans-serif}.meta{fill:#9da19b;font:14px Arial,sans-serif;letter-spacing:2px}
.stroke{fill:none;stroke:#f0eee8;stroke-width:15;stroke-linecap:round;stroke-linejoin:round}
.accent{fill:none;stroke:#d6f34a;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.guide{stroke:#747a73;stroke-width:2;stroke-dasharray:6 8;fill:none}
.dot{fill:#d6f34a}
</style></defs>
<rect class="bg" width="1200" height="620"/>
<text x="52" y="55" class="meta">THE BLACKBOOK ARCHIVE / VISUELLE EINORDNUNG</text>
<text x="52" y="100" class="txt" font-size="34">Tag und Handstyle</text>
<text x="52" y="133" class="body">Der Name ist die Signatur. Der Handstyle zeigt sich in der individuellen Form und Bewegung.</text>
<rect x="42" y="170" width="540" height="380" rx="14" class="panel"/>
<rect x="618" y="170" width="540" height="380" rx="14" class="panel"/>
