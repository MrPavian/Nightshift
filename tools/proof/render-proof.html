<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>NIGHTSHIFT 0.7A-T05 render proof</title>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js" } }</script>
<style>
  body { margin: 0; padding: 16px; background: #fff; font: 12px/1.4 monospace; color: #222; width: 1180px; }
  h1 { font-size: 14px; margin: 0 0 4px; } p { margin: 0 0 10px; }
  table { border-collapse: collapse; } td, th { border: 1px solid #ccc; padding: 4px; text-align: center; vertical-align: middle; }
  th { background: #f4f4f4; font-weight: normal; } td svg, td canvas { display: block; width: 150px; height: auto; }
  pre#out { white-space: pre-wrap; font-size: 10px; margin-top: 10px; }
</style></head>
<body>
<h1>NIGHTSHIFT 0.7A-T05 — topology-correct monochrome render proof</h1>
<p id="meta">loading…</p>
<table id="sheet"><thead><tr><th>glyph</th><th>SVG · light</th><th>SVG · dark</th><th>SVG · texture</th><th>Three.js · texture</th><th>SVG · diagnostic</th><th>parity</th></tr></thead><tbody></tbody></table>
<pre id="out">running…</pre>
<script type="module">
// Renders A/B/G/R/S from the canonical model with the SVG and Three.js
// renderers over light, dark and textured surfaces, rasterises both, and checks:
//  - probe points: counters show the surface pixel, filled faces show ink;
//  - silhouette parity: SVG vs Three.js binary masks differ only at edges.
import * as THREE from 'three';
import { GlyphRegistry } from '../../src/glyph/registry.js';
import { validateGlyphGeometry } from '../../src/glyph/validate-geometry.js';
import { buildRenderModel } from '../../src/render/render-model.js';
import { glyphGroup } from '../../src/render/svg.js';
import { buildGlyphObject } from '../../src/editor/three-glyph.js';

const SCALE = 3, PAD = 12, INK = '#111111';
const SURFACES = {
  light: { fill: '#f2efe6', ink: '#111111' },
  dark: { fill: '#16181d', ink: '#ece8dd' },
  texture: { pattern: true, ink: '#111111' },
};
const rgbOf = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
const get = (p) => fetch(`/${p}`).then((r) => r.json());
const out = document.getElementById('out');

function frame(model) {
  const b = model.bounds;
  return { x: b.minX - PAD, y: b.minY - PAD, w: b.maxX - b.minX + 2 * PAD, h: b.maxY - b.minY + 2 * PAD };
}
// Deterministic texture: diagonal stripes + dots in two mid tones (no randomness).
function textureDefs(f) {
  return `<defs><pattern id="tex" patternUnits="userSpaceOnUse" width="9" height="9" patternTransform="rotate(30)">
    <rect width="9" height="9" fill="#8a7f6a"/><rect width="4" height="9" fill="#b9ad92"/><circle cx="6.5" cy="4.5" r="1.3" fill="#5d5546"/></pattern></defs>`;
}
function surfaceRect(f, key) {
  return SURFACES[key].pattern
    ? `${textureDefs(f)}<rect data-role="surface" x="${f.x}" y="${f.y}" width="${f.w}" height="${f.h}" fill="url(#tex)"/>`
    : `<rect data-role="surface" x="${f.x}" y="${f.y}" width="${f.w}" height="${f.h}" fill="${SURFACES[key].fill}"/>`;
}
function svgDoc(model, key, { glyph = true, diagnostic = false } = {}) {
  const f = frame(model);
  const h = f.h + (diagnostic ? 12 : 0);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${f.x} ${f.y} ${f.w} ${h}" width="${f.w * SCALE}" height="${h * SCALE}" shape-rendering="crispEdges">` +
    surfaceRect({ ...f, h }, key) + (glyph ? glyphGroup(model, { fill: SURFACES[key].ink, diagnostic }) : '') + '</svg>';
}
async function rasterSvg(svgText) {
  const img = new Image();
  img.src = URL.createObjectURL(new Blob([svgText], { type: 'image/svg+xml' }));
  await img.decode();
  const c = document.createElement('canvas');
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  c.getContext('2d').drawImage(img, 0, 0);
  return c;
}
// Three.js: render the glyph over a plane textured with the SVG-rasterised surface.
async function rasterThree(model, surfaceCanvas) {
  const f = frame(model);
  const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(f.w * SCALE, f.h * SCALE, false);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(f.x, f.x + f.w, -f.y, -(f.y + f.h), -10, 10);
  const tex = new THREE.CanvasTexture(surfaceCanvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter; tex.generateMipmaps = false;
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(f.w, f.h), new THREE.MeshBasicMaterial({ map: tex }));
  plane.position.set(f.x + f.w / 2, -(f.y + f.h / 2), -1);
  scene.add(plane);
  scene.add(buildGlyphObject(model, { color: new THREE.Color(INK) }));
  renderer.render(scene, camera);
  const c = document.createElement('canvas');
  c.width = renderer.domElement.width; c.height = renderer.domElement.height;
  c.getContext('2d').drawImage(renderer.domElement, 0, 0);
  renderer.dispose();
  return c;
}
const px = (canvas, model, [x, y]) => {
  const f = frame(model);
  const d = canvas.getContext('2d').getImageData(Math.floor((x - f.x) * SCALE), Math.floor((y - f.y) * SCALE), 1, 1).data;
  return [d[0], d[1], d[2]];
};
const close = (a, b, tol = 6) => a.every((v, i) => Math.abs(v - b[i]) <= tol);
const isInk = (rgb, key = 'light') => close(rgb, rgbOf(SURFACES[key].ink), 10);

function maskDiff(c1, c2) {
  const a = c1.getContext('2d').getImageData(0, 0, c1.width, c1.height).data;
  const b = c2.getContext('2d').getImageData(0, 0, c2.width, c2.height).data;
  let ink = 0, diff = 0;
  const w = c1.width, h = c1.height;
  const inkAt = (d, i) => d[i] < 40 && d[i + 1] < 40 && d[i + 2] < 40;
  const edge = new Uint8Array(w * h);
  // Mark pixels within 1px of an ink/no-ink transition in the SVG mask (antialias/raster rule band).
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4, m = inkAt(a, i);
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const xx = x + dx, yy = y + dy;
      if (xx < 0 || yy < 0 || xx >= w || yy >= h) continue;
      if (inkAt(a, (yy * w + xx) * 4) !== m) { edge[y * w + x] = 1; break; }
    }
  }
  let interiorDiff = 0;
  for (let p = 0; p < w * h; p++) {
    const i = p * 4, ma = inkAt(a, i), mb = inkAt(b, i);
    if (ma) ink++;
    if (ma !== mb) { diff++; if (!edge[p]) interiorDiff++; }
  }
  return { inkPixels: ink, differingPixels: diff, differingOutsideEdgeBand: interiorDiff };
}

try {
  const [snapshot, overlay, parameterContract, validationContract, profile] = await Promise.all([
    get('data/legacy/v06-glyph-paths.json'), get('data/semantic/abgrs-semantic-overlay.v1.json'),
    get('contracts/glyph-parameter-contract.v1.json'), get('contracts/glyph-geometry-validation.v1.json'),
    get('data/validator-profiles/legacy-v06.v1.json'),
  ]);
  const registry = GlyphRegistry.build({ snapshot, overlay, parameterContract, validationContract });
  document.getElementById('meta').textContent =
    `three r${THREE.REVISION} · scale ${SCALE} · ink #111111 (light/texture), #ece8dd (dark) · surfaces light/dark/texture · validator profile ${profile.profileId}@${profile.version}`;
  const results = [];
  const tbody = document.querySelector('#sheet tbody');
  for (const ch of ['A', 'B', 'G', 'R', 'S']) {
    const glyph = registry.getByChar(ch);
    const report = validateGlyphGeometry(glyph, profile);
    const model = buildRenderModel(glyph, report);
    const row = document.createElement('tr');
    row.innerHTML = `<td>${ch}<br><small>${glyph.maturity}</small></td>`;
    const probes = [];
    for (const key of ['light', 'dark', 'texture']) {
      const surface = await rasterSvg(svgDoc(model, key, { glyph: false }));
      const svgR = await rasterSvg(svgDoc(model, key));
      for (const p of model.probes) {
        const got = px(svgR, model, p.point), bg = px(surface, model, p.point);
        probes.push({ renderer: 'svg', surface: key, contourId: p.contourId, expect: p.expect,
          ok: p.expect === 'filled' ? isInk(got, key) : close(got, bg) && !isInk(got, key) });
      }
      const td = document.createElement('td'); td.append(svgR); row.append(td);
      if (key === 'texture') {
        const threeR = await rasterThree(model, surface);
        for (const p of model.probes) {
          const got = px(threeR, model, p.point), bg = px(surface, model, p.point);
          probes.push({ renderer: 'three', surface: key, contourId: p.contourId, expect: p.expect,
            ok: p.expect === 'filled' ? isInk(got) : close(got, bg, 12) && !isInk(got) });
        }
        // Silhouette parity on a flat surface (texture would hide mask edges).
        const flat = await rasterSvg(svgDoc(model, 'light', { glyph: false }));
        const parity = maskDiff(await rasterSvg(svgDoc(model, 'light')), await rasterThree(model, flat));
        const tdT = document.createElement('td'); tdT.append(threeR); row.append(tdT);
        results.push({ glyph: ch, geometryHash: model.geometryHash, revision: model.revision, parity, probes });
      }
    }
    const tdD = document.createElement('td'); tdD.append(await rasterSvg(svgDoc(model, 'light', { diagnostic: true }))); row.append(tdD);
    const r = results.at(-1);
    const probeOk = r.probes.every((p) => p.ok);
    const parityOk = r.parity.differingOutsideEdgeBand === 0;
    row.insertAdjacentHTML('beforeend', `<td>${probeOk && parityOk ? 'PASS' : 'FAIL'}<br><small>probes ${r.probes.filter((p) => p.ok).length}/${r.probes.length}<br>edge px ${r.parity.differingPixels}</small></td>`);
    tbody.append(row);
  }
  // Negative control: the v0.6 technique (paint counters with paper colour #eee9dc)
  // must be detected by the same probe on dark and textured surfaces.
  const controls = [];
  {
    const glyph = registry.getByChar('A');
    const model = buildRenderModel(glyph, validateGlyphGeometry(glyph, profile));
    const counter = model.regions[0].holes[0];
    const patch = `<path d="${counter.segments.map((s) => s.type === 'move' ? `M${s.x} ${s.y}` : s.type === 'line' ? `L${s.x} ${s.y}` : 'Z').join(' ')}" fill="#eee9dc"/>`;
    for (const key of ['dark', 'texture']) {
      const surface = await rasterSvg(svgDoc(model, key, { glyph: false }));
      const legacy = await rasterSvg(svgDoc(model, key).replace('</svg>', `${patch}</svg>`));
      const probe = model.probes.find((p) => p.expect === 'surface');
      const detected = !close(px(legacy, model, probe.point), px(surface, model, probe.point));
      controls.push({ control: 'legacy-paper-colour-patch', surface: key, detected });
    }
  }
  const pass = controls.every((c) => c.detected) &&
    results.every((r) => r.probes.every((p) => p.ok) && r.parity.differingOutsideEdgeBand === 0);
  out.textContent = (pass ? 'PROOF-PASS ' : 'PROOF-FAIL ') + JSON.stringify({ three: THREE.REVISION, scale: SCALE, results, controls });
} catch (e) {
  out.textContent = 'PROOF-FAIL ' + JSON.stringify({ error: e.message, stack: e.stack });
}
</script></body></html>
