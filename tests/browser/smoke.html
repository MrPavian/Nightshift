<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>NIGHTSHIFT model smoke test</title></head>
<body><pre id="out">running…</pre>
<script type="module">
// Loads the canonical model in a real browser (no Node APIs) and reports the result.
// Serve the repository root (e.g. `python3 -m http.server`) and open /tests/browser/smoke.html.
import { GlyphRegistry } from '../../src/glyph/registry.js';
import { topologyReport } from '../../src/glyph/semantic-overlay.js';
const get = (p) => fetch(`../../${p}`).then((r) => r.json());
const out = document.getElementById('out');
try {
  const [snapshot, overlay, parameterContract, validationContract] = await Promise.all([
    get('data/legacy/v06-glyph-paths.json'), get('data/semantic/abgrs-semantic-overlay.v1.json'),
    get('contracts/glyph-parameter-contract.v1.json'), get('contracts/glyph-geometry-validation.v1.json'),
  ]);
  const r = GlyphRegistry.build({ snapshot, overlay, parameterContract, validationContract });
  const roundTrip = GlyphRegistry.fromJSON(r.serialize()).serialize() === r.serialize();
  const g = topologyReport(r.getByChar('G')).findings.map((f) => f.code);
  const ok = r.isValid && roundTrip && r.list().length === 26 && g.includes('TOPO_APERTURE_UNRESOLVED');
  out.textContent = `${ok ? 'SMOKE-PASS' : 'SMOKE-FAIL'} glyphs=${r.list().length} errors=${r.errors.length} roundTrip=${roundTrip} hashA=${r.getByChar('A').variants[0].geometryHash.slice(0, 12)}`;
} catch (e) {
  out.textContent = `SMOKE-FAIL ${e.message}`;
}
</script></body></html>
